# Alacritty configurations
# Modified: 2026-09-06

[general]

import = [
    "~/.config/alacritty/themes/ganbaru_matcha.toml",
]

[window]

opacity = 0.99
blur = true # Works only on compositors that implement background blur.

startup_mode = "Maximized"

padding.x = 4
padding.y = 2

decorations = "None"
decorations_theme_variant = "Dark"

[font]

size = 13.0

normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold = { family = "FiraCode Nerd Font Mono", style = "Bold" }
italic = { family = "FiraCode Nerd Font Mono", style = "Italic" }
bold_italic = { family = "FiraCode Nerd Font Mono", style = "Bold Italic" }
