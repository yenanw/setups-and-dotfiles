#======== General ========#

# Start windows and panes at 1 rather than 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows after one is closed
set -g renumber-windows on

# More scrollback
set -g history-limit 50000

# Faster escape-key handling (nice for Vim/Neovim)
set -sg escape-time 10

# Enable mouse scrolling, pane selection, resizing, etc.
set -g mouse on

# Use Vim keybinds for tmux view mode
setw -g mode-keys vi

# True color settings
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",alacritty:usstyle"


#======== Status line ========#

set -g status on
set -g status-position bottom

# Use the terminal's own background instead of a conspicuous solid bar
set -g status-style 'bg=default,fg=colour244'

# Keep it minimal
set -g status-left ''
set -g status-right '#[fg=colour240]%H:%M'

# Minimal window names
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #[fg=colour250,bold]#I:#W#[default] '

# No separator characters between windows
set -g window-status-separator ''

# Keep window list on the left
set -g status-justify left

# Remove background and change the color of the confirmation text
set -g message-style 'bg=default,fg=colour250'
set -g message-command-style 'bg=default,fg=colour250'


#======== Panes ========#

# Subtle inactive border, slightly clearer active one.
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour245'

# Don't rename windows based on shell commands.
setw -g automatic-rename off


#======== Convenience ========#

# Reload config with Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'

# Show key binds with `?`
bind ? list-keys
